<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Web Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PIN Entry Screen -->
    <div id="pin-screen" class="screen">
        <div class="pin-container">
            <h1>Web Controller</h1>
            <p class="subtitle">Enter PIN to connect</p>
            <div class="pin-display">
                <input type="text" id="pin-input" maxlength="6" pattern="[0-9]{6}" placeholder="000000" autocomplete="off" inputmode="numeric">
            </div>
            <div id="pin-error" class="error-message hidden"></div>
            <div id="connection-status" class="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>
    </div>

    <!-- Gamepad Interface -->
    <div id="gamepad-screen" class="screen hidden">
        <div class="gamepad-container">
            <!-- Connection Status Bar -->
            <div class="status-bar">
                <div class="status-indicator">
                    <span class="status-dot connected"></span>
                    <span class="status-text">Connected</span>
                </div>
                <div class="controller-id">Controller <span id="controller-id">-</span></div>
            </div>

            <!-- Left Joystick -->
            <div class="joystick-container left-joystick">
                <div class="joystick-base">
                    <div class="joystick-stick" id="left-stick"></div>
                </div>
                <button class="stick-click-btn" id="btn-left-stick" data-button="leftStick">L3</button>
                <div class="joystick-label">L</div>
            </div>

            <!-- Right Joystick -->
            <div class="joystick-container right-joystick">
                <div class="joystick-base">
                    <div class="joystick-stick" id="right-stick"></div>
                </div>
                <button class="stick-click-btn" id="btn-right-stick" data-button="rightStick">R3</button>
                <div class="joystick-label">R</div>
            </div>

            <!-- Left Shoulder Buttons -->
            <div class="shoulder-buttons left-shoulder">
                <button class="shoulder-btn" id="btn-lb" data-button="lb">LB</button>
                <button class="trigger-btn" id="btn-lt" data-trigger="lt">LT</button>
            </div>

            <!-- Right Shoulder Buttons -->
            <div class="shoulder-buttons right-shoulder">
                <button class="shoulder-btn" id="btn-rb" data-button="rb">RB</button>
                <button class="trigger-btn" id="btn-rt" data-trigger="rt">RT</button>
            </div>

            <!-- D-pad -->
            <div class="dpad-container">
                <div class="dpad">
                    <button class="dpad-btn" data-direction="1" data-dpad="1">↑</button>
                    <button class="dpad-btn" data-direction="2" data-dpad="2">←</button>
                    <button class="dpad-btn" data-direction="4" data-dpad="4">→</button>
                    <button class="dpad-btn" data-direction="3" data-dpad="3">↓</button>
                </div>
            </div>

            <!-- Action Buttons (A, B, X, Y) -->
            <div class="action-buttons">
                <button class="action-btn btn-y" id="btn-y" data-button="y">Y</button>
                <button class="action-btn btn-x" id="btn-x" data-button="x">X</button>
                <button class="action-btn btn-a" id="btn-a" data-button="a">A</button>
                <button class="action-btn btn-b" id="btn-b" data-button="b">B</button>
            </div>

            <!-- System Buttons -->
            <div class="system-buttons">
                <button class="system-btn" id="btn-back" data-button="back">Back</button>
                <button class="system-btn" id="btn-start" data-button="start">Start</button>
            </div>
        </div>
    </div>

    <script src="controller.js"></script>
</body>
</html>
