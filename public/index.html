<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="connection-status" class="connection-status disconnected">
        <span id="status-text">Disconnected</span>
    </div>

    <div class="controller-container">
        <!-- Left Stick -->
        <div class="stick-container left-stick">
            <div class="stick-base" id="left-stick-base">
                <div class="stick-handle" id="left-stick-handle"></div>
            </div>
        </div>

        <!-- Right Stick -->
        <div class="stick-container right-stick">
            <div class="stick-base" id="right-stick-base">
                <div class="stick-handle" id="right-stick-handle"></div>
            </div>
        </div>

        <!-- D-Pad -->
        <div class="dpad-container">
            <div class="dpad" id="dpad">
                <button class="dpad-btn" data-direction="1">▲</button>
                <button class="dpad-btn" data-direction="2">◄</button>
                <button class="dpad-btn" data-direction="0">●</button>
                <button class="dpad-btn" data-direction="4">►</button>
                <button class="dpad-btn" data-direction="3">▼</button>
            </div>
        </div>

        <!-- Face Buttons -->
        <div class="face-buttons">
            <button class="face-btn" id="btn-y" data-button="y">Y</button>
            <button class="face-btn" id="btn-x" data-button="x">X</button>
            <button class="face-btn" id="btn-a" data-button="a">A</button>
            <button class="face-btn" id="btn-b" data-button="b">B</button>
        </div>

        <!-- Shoulder Buttons (Bumpers) -->
        <div class="shoulder-buttons">
            <button class="shoulder-btn" id="btn-lb" data-button="lb">LB</button>
            <button class="shoulder-btn" id="btn-rb" data-button="rb">RB</button>
        </div>

        <!-- Triggers -->
        <div class="trigger-buttons">
            <button class="trigger-btn" id="btn-lt" data-button="lt">LT</button>
            <button class="trigger-btn" id="btn-rt" data-button="rt">RT</button>
        </div>

        <!-- Home/Back Buttons -->
        <div class="system-buttons">
            <button class="system-btn" id="btn-back" data-button="back">BACK</button>
            <button class="system-btn" id="btn-start" data-button="start">START</button>
        </div>
    </div>

    <script src="controller.js"></script>
</body>
</html>
